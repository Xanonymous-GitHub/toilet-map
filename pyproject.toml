[project]
name = "jp-kr-toilet-map-tools"
version = "1.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff==0.17.0", "playwright==1.63.0"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", "node_modules", "dist", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
cache-dir = ".cache/uv"
