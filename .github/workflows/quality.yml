name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: bun install --frozen-lockfile
      - run: uv sync --locked
      - run: bun run verify
