[build]
command = "bun run build"
publish = "dist/client"

[build.environment]
BUN_VERSION = "1.4.3"
BUN_FLAGS = "--frozen-lockfile"
NODE_VERSION = "24"

[functions]
directory = "dist/netlify/functions"
node_bundler = "none"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(self)"
Content-Security-Policy = "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/downloads/*"
[headers.values]
Cache-Control = "public, max-age=3600"
Content-Disposition = "attachment"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-store"
Service-Worker-Allowed = "/"

[[headers]]
for = "/"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache"
